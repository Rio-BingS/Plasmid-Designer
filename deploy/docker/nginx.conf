# X-Real-IP 透传策略：仅当连接来自可信的宿主机前置 nginx 时，才转发其解析好的
# X-Real-IP（Cloudflare 真实客户端 IP）；其它直连一律取 socket 对端地址，防止
# 伪造 X-Real-IP 头获得全新限流 key 绕过限流。宿主机经发布端口进入时来源是
# compose 网络网关（docker-compose.yml 固定为 172.28.0.1，改 PLASMID_GATEWAY 时
# 同步此处）；不再信整个 172.16.0.0/12，同网段其它容器无法借此伪造。
# 后端 rate_limit.get_client_ip 只在可信代理场景采信 X-Real-IP。
geo $trusted_realip {
    default         $remote_addr;
    172.28.0.1      $http_x_real_ip;
    127.0.0.1       $http_x_real_ip;
    ::1             $http_x_real_ip;
}

# X-Forwarded-Proto 透传：本容器只监听 http，$scheme 恒为 http。HTTPS 在宿主机
# nginx / 负载均衡终止时，后端要拿到外层的真实协议，AUTH_COOKIE_SECURE=auto 才会
# 给会话 Cookie 置 Secure。只采信可信前置（地址与上方 $trusted_realip 相同，改动
# 时两处同步）传来的 http/https，其余直连一律用本连接的 $scheme，防伪造
geo $proto_from_trusted {
    default         0;
    172.28.0.1      1;
    127.0.0.1       1;
    ::1             1;
}

map "$proto_from_trusted:$http_x_forwarded_proto" $forwarded_proto {
    default                     $scheme;
    "~*^1:\s*https\s*(,|$)"     https;
    "~*^1:\s*http\s*(,|$)"      http;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_comp_level 6;
    gzip_buffers 16 8k;

    # 安全头。注意：nginx 的 add_header 只在当前层级没有任何 add_header 时
    # 才继承上层——下方凡是自带 add_header 的 location 都必须整组重申。
    # CSP：Vite 构建产物无内联脚本（index.html 只引用 /assets 下的模块与样式），
    # script-src 只放 'self'；style-src 留 'unsafe-inline' 兼容运行时内联样式；
    # blob:/data: 供画布导出与内联 SVG 图标使用
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # HSTS 只能在 HTTPS server 中下发（见文件末尾 TLS 块），明文 80 端口不加

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 入口禁缓存：发版后浏览器立即拿到新壳（SPA 路由的 try_files 内部
    # 重定向到 /index.html 时同样命中本块）。带哈希的静态资源仍走下方 1y 长缓存。
    # 注意：location 内出现 add_header 会覆盖 server 级继承，安全头需在此重申
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 测序上传接口（单样品 / 设计深链 / 载体深链 / 批量）单独放宽：
    # 后端上限为单文件 20MB、单样品最多 24 条 read（约 500MB）、批量请求
    # 总字节 500MB（sequencing_routes.MAX_BATCH_REQUEST_BYTES），这里取
    # 520m 留出 multipart 开销与信息表；批量逐样品运行，前端超时 600s，
    # 读超时与之对齐。其余 API 走下方 /api 的 100m / 300s
    location ~ ^/api/(designs/[^/]+/|vectors/[^/]+/)?sequencing/analyze(-batch)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 520m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # 批量测序分块上传会话（/api/sequencing/batch-sessions/...）：前端把一批
    # 文件切成 ≤90 MB 的分块（Cloudflare 免费版单请求上限 100 MB），100m 留出
    # multipart 开销；finalize 在请求内最多等 SEQUENCING_BATCH_FINALIZE_WAIT
    # （默认 60 s）后转 202 轮询，读超时 120s 足够
    location ^~ /api/sequencing/batch-sessions {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        client_max_body_size 100m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # API代理 — 转发到后端容器
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # 其余接口最大上传为载体文件 20MB（vector_routes 的 max_upload），
        # 100m 已留足余量；超限 nginx 直接 413，不再让大请求占住后端
        client_max_body_size 100m;

        # 超时设置（设计任务可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # 健康检查端点代理
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
    }

    # API 文档代理。后端默认 ENABLE_API_DOCS=false，此处只会拿到 404；容器内无法按
    # 来源 allow/deny（宿主机转发进来的请求都来自网关 172.28.0.1），开启后请在宿主机
    # nginx 限制来源（审查 10 L7）
    location /docs {
        # Swagger UI 依赖 jsdelivr CDN 与内联脚本，单独放宽 CSP（仅文档页）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_realip;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

