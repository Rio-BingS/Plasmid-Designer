services:
  # Backend API service
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: plasmid-backend
    restart: unless-stopped
    # 仅绑定本机回环供宿主机调试/直连后端；前端经 plasmid-network 内部网络访问 backend:8000，
    # 公网无需暴露。宿主机 8000 常被其他应用占用，通过 BACKEND_PORT 可改
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../data:/app/data
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-plasmid}:${DB_PASSWORD:-plasmid_secure_2026}@db:5432/plasmid_designer
      # Redis 已启用 requirepass，连接串需携带密码（与 redis 服务保持同一默认值）
      - REDIS_URL=redis://:${REDIS_PASSWORD:-plasmid_redis_2026}@redis:6379/0
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data
      - VECTORS_DIR=/app/data/vectors
      - CODON_TABLES_DIR=/app/data/codon_tables
      - STORAGE_MODE=${STORAGE_MODE:-database}
      - BACKEND_WORKERS=${BACKEND_WORKERS:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plasmid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend web service
  frontend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: plasmid-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plasmid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: plasmid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-plasmid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plasmid_secure_2026}
      POSTGRES_DB: plasmid_designer
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 表结构由 backend 启动时 init_db()（SQLAlchemy create_all）自动创建，
    # 不挂载 init.sql——其手工 DDL 已与 ORM 模型漂移
    # 安全：不对公网暴露，仅绑定本机回环供宿主机调试；
    # backend 经 plasmid-network 内部网络访问 db:5432
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - plasmid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plasmid} -d plasmid_designer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: plasmid-redis
    restart: unless-stopped
    # 安全：启用 requirepass（默认值与 backend 的 REDIS_URL 保持一致，生产环境用 .env 覆盖）
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:-plasmid_redis_2026}"
    # 安全：不对公网暴露，仅绑定本机回环供宿主机调试；backend 经内部网络访问 redis:6379
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - plasmid-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-plasmid_redis_2026}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  plasmid-network:
    driver: bridge
