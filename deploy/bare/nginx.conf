server {
    listen 80;
    server_name _;
    root /opt/plasmid-designer/src/frontend/dist;
    index index.html;

    # 非 API 路径不接受大请求体；API 上传上限见下方 /api 与测序上传块
    client_max_body_size 1m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_comp_level 6;
    gzip_buffers 16 8k;

    # 安全头。注意：nginx 的 add_header 只在当前层级没有任何 add_header 时
    # 才继承上层——下方凡是自带 add_header 的 location 都必须整组重申。
    # CSP：Vite 构建产物无内联脚本（index.html 只引用 /assets 下的模块与样式），
    # script-src 只放 'self'；style-src 留 'unsafe-inline' 兼容运行时内联样式；
    # blob:/data: 供画布导出与内联 SVG 图标使用
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # HSTS 只能在 HTTPS server 中下发（见文件末尾 TLS 块），明文 80 端口不加

    # 前端 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 测序上传接口（单样品 / 设计深链 / 载体深链 / 批量）单独放宽：
    # 后端上限为单文件 20MB、单样品最多 24 条 read（约 500MB）、批量请求
    # 总字节 500MB（sequencing_routes.MAX_BATCH_REQUEST_BYTES），这里取
    # 520m 留出 multipart 开销与信息表；批量逐样品运行，前端超时 600s，
    # 读超时与之对齐。其余 API 走下方 /api 的 100m / 300s
    location ~ ^/api/(designs/[^/]+/|vectors/[^/]+/)?sequencing/analyze(-batch)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 520m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # API 代理 — 转发到本机后端
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 其余接口最大上传为载体文件 20MB（vector_routes 的 max_upload），
        # 100m 已留足余量；超限 nginx 直接 413，不再让大请求占住后端
        client_max_body_size 100m;

        # 超时设置（设计任务可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # 健康检查端点代理
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API 文档代理 — 终审 B-08/H-04：/docs 与 openapi.json 只对内网/本机
    # 开放（默认拒绝公网；运维如需对外，自行改为 allow all 并评估风险）
    location /docs {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        # Swagger UI 依赖 jsdelivr CDN 与内联脚本，单独放宽 CSP（仅文档页）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# HTTPS 配置 — 使用 certbot --nginx 自动生成，或手动配置：
