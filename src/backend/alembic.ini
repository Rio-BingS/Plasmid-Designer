# Alembic config - database schema migrations
#
# Usage (run inside src/backend/, or pass -c /path/to/alembic.ini):
#   python -m alembic -c alembic.ini revision --autogenerate -m "..."
#   python -m alembic -c alembic.ini upgrade head
#
# Database URL resolution (see alembic/env.py, highest first):
#   1. command line -x db_url=postgresql://...
#   2. env var ALEMBIC_DATABASE_URL
#   3. app.config settings.DATABASE_URL (same source as the running backend)
#
# Existing deployments (tables already created by init_db's create_all plus
# lightweight column migrations) run ONCE:
#   alembic stamp head
# Then `alembic upgrade head` before every upgrade. See docs/MIGRATIONS.md.
# NOTE: keep this file ASCII-only; configparser decodes it with the locale
# encoding (gbk on zh-CN Windows) and would crash on UTF-8 Chinese comments.

[alembic]
script_location = alembic
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# URL intentionally empty: env.py resolves it (see priority list above) so the
# value never drifts between here and the backend runtime config
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
